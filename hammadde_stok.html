<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hammadde Stok Takip Paneli</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1C2A3A;--ink2:#51606F;--line:#D5DCE3;--bg:#EDF0F3;--paper:#fff;--steel:#2F6690;--steel-l:#D6E4EF;--red:#B3261E;--red-l:#F6DCDA;--amber:#A8660F;--amber-l:#F5E6CC;--green:#3A7D44;--green-l:#DCEBDD;--grey:#8A96A2;--grey-l:#E4E8EC;--inp:#FFFBEF}
*{box-sizing:border-box}
body{margin:0;font-family:Barlow,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--steel);outline-offset:1px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
header{background:var(--ink);color:#fff;padding:7px 16px;display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
header h1{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:600;font-size:22px;margin:0;display:none}
header .sp{flex:1}
.hgrp{display:flex;align-items:center;gap:6px;color:#AFC0D0;font-size:13px}
.hgrp input{width:54px;background:#2A3C50;border:1px solid #5B6E82;color:#fff;border-radius:4px;padding:5px 6px;text-align:center}
.hbtn{background:transparent;border:1px solid #5B6E82;color:#fff;border-radius:4px;padding:5px 11px;cursor:pointer}
.hbtn:hover{background:#2A3C50}
.saved{color:#8FD19E;font-size:12px;min-width:70px}
main{padding:12px 18px 40px}
.status-bar{display:flex;margin-bottom:12px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--paper)}
.sbtn{flex:1;border:0;border-right:1px solid var(--line);background:var(--paper);padding:9px 14px;text-align:left;cursor:pointer;display:flex;align-items:baseline;gap:10px}
.sbtn:last-child{border-right:0}
.sbtn b{font-family:"Barlow Condensed";font-size:28px;font-weight:600;line-height:1}
.sbtn span{color:var(--ink2)}
.sbtn[aria-pressed=true]{box-shadow:inset 0 -3px 0 currentColor}
.s-KRİTİK{color:var(--red)}.s-UYARI{color:var(--amber)}.s-İZLE{color:var(--steel)}.s-YETERLİ{color:var(--green)}.s-PASİF{color:var(--grey)}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.tools input[type=search],.tools select{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:7px 10px}
.tools input[type=search]{width:200px}
.tools label{color:var(--ink2);display:flex;gap:6px;align-items:center}
.tbtn{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:6px 12px;cursor:pointer}
.tbtn:hover{border-color:var(--steel)}
.tbtn.pri{background:var(--steel);border-color:var(--steel);color:#fff}
.tbtn.del{color:var(--red)}
.legend{display:flex;gap:14px;color:var(--ink2);font-size:12px;margin-left:auto}
.legend i{display:inline-block;width:12px;height:12px;vertical-align:-2px;margin-right:4px}
.tablewrap{background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{background:#F5F7F9;text-align:left;font-weight:600;font-size:12.5px;color:var(--ink2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
#main th[data-k]{cursor:pointer}
th.num{text-align:right}
td{padding:7px 10px;border-bottom:1px solid #ECEFF2;vertical-align:middle}
#main tbody tr{cursor:pointer}
#main tbody tr:hover{background:#F4F8FB}
.grp{color:var(--ink2);font-size:12.5px;white-space:nowrap}
.nm{font-weight:500;min-width:160px}
.code{color:var(--grey);font-size:12px;font-weight:400}
.pill{display:inline-block;padding:2px 8px;border-radius:3px;font-size:12px;font-weight:600}
.p-KRİTİK{background:var(--red-l);color:var(--red)}.p-UYARI{background:var(--amber-l);color:var(--amber)}.p-İZLE{background:var(--steel-l);color:var(--steel)}.p-YETERLİ{background:var(--green-l);color:var(--green)}.p-PASİF{background:var(--grey-l);color:var(--grey)}
.neg{color:var(--red)!important;font-weight:600}
.runway{display:grid;grid-template-columns:repeat(26,1fr);gap:1px;width:208px;height:20px}
.runway i{display:block;height:100%;position:relative}
.runway i.in::after{content:"";position:absolute;left:0;right:0;top:-3px;height:3px;background:var(--ink)}
.wkhead{display:grid;grid-template-columns:repeat(26,1fr);width:208px;font-size:10px;color:var(--grey);font-weight:400}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(28,42,58,.35);display:none;z-index:5}
.scrim.open{display:block}
aside{position:fixed;top:0;right:0;height:100%;width:min(980px,100%);background:var(--paper);transform:translateX(100%);transition:transform .18s ease;overflow-y:auto;box-shadow:-8px 0 24px rgba(28,42,58,.18);z-index:6}
aside.open{transform:none}
@media (prefers-reduced-motion:reduce){aside{transition:none}}
.dh{padding:14px 22px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:10px}
.dh .fields{display:grid;grid-template-columns:2fr 1fr 1.3fr 1fr;gap:8px}
.dh label{font-size:11.5px;color:var(--ink2);display:flex;flex-direction:column;gap:2px}
.dh input{border:1px solid var(--line);border-radius:4px;padding:5px 8px;background:var(--inp)}
.dh input.big{font-size:17px;font-weight:600}
.dh .acts{display:flex;gap:8px;align-items:flex-start}
.x{border:0;background:none;font-size:26px;cursor:pointer;color:var(--ink2);line-height:1;padding:0 4px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line)}
.stats div{padding:10px 16px;border-right:1px solid var(--line)}
.stats div:last-child{border-right:0}
.stats small{display:block;color:var(--ink2);font-size:12px}
.stats b{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.sec{padding:12px 22px}
.sec h3{margin:0 0 8px;font-size:15px;font-weight:600;display:flex;gap:12px;align-items:center}
.sec h3 small{font-weight:400;color:var(--ink2);font-size:12.5px}
.chart svg{width:100%;height:auto;display:block}
.grid th{position:sticky;top:0;z-index:1;font-size:12px;padding:6px 6px}
.grid td{padding:0;border:1px solid #E3E8ED}
.grid td.wk{padding:3px 8px;background:#F5F7F9;font-weight:500;white-space:nowrap;font-size:12.5px}
.grid td.calc{padding:3px 8px;font-size:13px;background:#FAFBFC}
.grid input{width:100%;border:0;background:transparent;padding:5px 7px;font-size:13px;min-width:0}
.grid input:focus{background:var(--inp);outline:2px solid var(--steel);outline-offset:-2px}
.grid input.n{text-align:right;font-variant-numeric:tabular-nums}
.grid input.bad{color:var(--red);background:var(--red-l)}
.grid tr.cur td.wk{background:var(--steel);color:#fff}
.grid tr.past{opacity:.6}
.hint{color:var(--ink2);font-size:12px;margin:6px 0 0}
@media (max-width:760px){main{padding-left:10px;padding-right:10px}header{padding-left:10px;padding-right:10px}.status-bar{flex-wrap:wrap}.sbtn{flex:1 1 45%}.stats{grid-template-columns:repeat(2,1fr)}.dh .fields{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <h1>Hammadde Stok Takip Paneli</h1>
  <div class="hgrp">
    <button class="hbtn" id="prevW" aria-label="Önceki hafta">‹</button>
    Hafta <input id="wk" type="number" min="1" max="52"> / <input id="yr" type="number" style="width:66px">
    <button class="hbtn" id="nextW" aria-label="Sonraki hafta">›</button>
  </div>
  <div class="hgrp" title="Bu kadar hafta içinde eksiye düşen hammadde kritik / uyarı olarak işaretlenir">
    Kritik ≤ <input id="thK" type="number" min="1" max="26"> hf  Uyarı ≤ <input id="thU" type="number" min="1" max="26"> hf
  </div>
  <span class="sp"></span>
  <span class="saved" id="saved" style="display:none"></span>
  <button class="hbtn" id="bkp" style="display:none">Yedek al</button>
  <button class="hbtn" id="rst" style="display:none">Yedekten yükle</button>
  <input type="file" id="file" accept=".json" hidden>
</header>
<main>
  <div class="status-bar" id="sbar"></div>
  <div class="tools">
    <input type="search" id="q" placeholder="Hammadde, kod veya grup ara">
    <select id="grp"></select>
    <label><input type="checkbox" id="hidePasif" checked> Pasifleri gizle</label>
    <button class="tbtn pri" id="addM">Yeni hammadde</button>
    <button class="tbtn" id="csv">Listeyi CSV indir</button>
    <div class="legend">
      <span><i style="background:var(--steel)"></i>Stok var</span>
      <span><i style="background:var(--red)"></i>Eksi bakiye</span>
      <span><i style="background:var(--ink);height:3px;vertical-align:4px"></i>Giriş haftası</span>
    </div>
  </div>
  <div class="tablewrap"><table id="main"><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div>
</main>
<div class="scrim" id="scrim"></div>
<aside id="drawer" aria-hidden="true"></aside>
<datalist id="grps"></datalist>

function refreshM(m){
  const r=calc(m),dr=$('drawer'),p=r.status==='PASİF';
  const lastK=Math.max(...[...dr.querySelectorAll('.grid tr')].slice(1).map(t=>+t.dataset.k));
  const by={};series(m,lastK).forEach(x=>by[x.k]=x);
  dr.querySelectorAll('.grid tbody tr').forEach(tr=>{const x=by[tr.dataset.k];if(!x)return;
    const tc=tr.querySelector('[data-o=t]'),bc=tr.querySelector('[data-o=b]');
    tc.textContent=x.t?fmt(x.t):'';bc.textContent=fmt(x.bal);bc.classList.toggle('neg',x.bal<-0.5);
    tr.querySelectorAll('input.n').forEach(i=>i.classList.toggle('bad',i.value.trim()!==''&&isNaN(ev(i.value))))});
  $('dstats').innerHTML=`<div><small>Durum</small><b><span class="pill p-${r.status}">${r.status}</span></b></div>
    <div><small>Mevcut stok</small><b class="${r.now<0?'neg':''}">${fmt(r.now)} kg</b></div>
    <div><small>Ort. haftalık tüketim</small><b>${fmt(r.f26/H)} kg</b></div>
    <div><small>Yeter</small><b>${p?'—':r.cover==null?'26+ hafta':r.cover+' hafta'}</b></div>
    <div><small>İlk eksik hafta</small><b class="${r.firstNeg?'neg':''}">${p?'—':wl(r.firstNeg)}</b></div>`;
  const W=900,Hh=170,pd=28,max=Math.max(1,...r.bal),min=Math.min(0,...r.bal),sc=v=>pd+(Hh-2*pd)*(max-v)/(max-min),bw=(W-60)/H,zero=sc(0);
  $('dchart').innerHTML=`<h3>26 haftalık bakiye</h3><svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="26 haftalık bakiye grafiği">
    <line x1="46" x2="${W-6}" y1="${zero}" y2="${zero}" stroke="#1C2A3A"/>
    <text x="42" y="${sc(max)+4}" font-size="10" text-anchor="end" fill="#51606F">${fmt(max)}</text><text x="42" y="${zero+4}" font-size="10" text-anchor="end" fill="#51606F">0</text>
    ${min<0?`<text x="42" y="${sc(min)+4}" font-size="10" text-anchor="end" fill="#B3261E">${fmt(min)}</text>`:''}
    ${r.bal.map((b,i)=>{const x=50+i*bw,y=Math.min(sc(b),zero),h=Math.max(1,Math.abs(sc(b)-zero));
      return `<rect x="${x+1}" y="${y}" width="${bw-2}" height="${h}" fill="${b<-0.5?'#B3261E':'#2F6690'}"><title>${wl(r.K[i])}: ${fmt(b)} kg</title></rect>${r.inW[i]?`<rect x="${x+1}" y="${pd-12}" width="${bw-2}" height="4" fill="#1C2A3A"/>`:''}<text x="${x+bw/2}" y="${Hh-6}" font-size="10" text-anchor="middle" fill="#8A96A2">${r.K[i]%100}</text>`}).join('')}</svg>`;
}
function closeM(){V.open=null;$('drawer').classList.remove('open');$('scrim').classList.remove('open');$('drawer').setAttribute('aria-hidden','true')}
$('scrim').onclick=closeM;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&V.open)closeM()});

/* ---- üst çubuk ve araçlar ---- */
function syncHead(){$('wk').value=D.wk;$('yr').value=D.yr;$('thK').value=D.thK;$('thU').value=D.thU}
function setWeek(k){D.wk=k%100;D.yr=Math.floor(k/100);syncHead();saveData();render();if(V.open)openM(V.open)}
$('prevW').onclick=()=>setWeek(pk(curK()));$('nextW').onclick=()=>setWeek(nk(curK()));
$('wk').onchange=()=>{const v=+$('wk').value;if(v>=1&&v<=52)setWeek(D.yr*100+v);else syncHead()};
$('yr').onchange=()=>{const v=+$('yr').value;if(v>2000)setWeek(v*100+D.wk);else syncHead()};
['thK','thU'].forEach(id=>$(id).onchange=()=>{const v=+$(id).value;if(v>0){D[id]=v;saveData();render()}else syncHead()});
['q','grp','hidePasif'].forEach(id=>$(id).addEventListener('input',render));
$('addM').onclick=()=>{const g=$('grp').value||(D.mats[0]||{}).grp||'';const m={id:'m'+Date.now(),grp:g,name:'Yeni hammadde',code:'',note:'',rows:{}};
  D.mats.push(m);saveData();render();openM(m.id);setTimeout(()=>{const i=$('drawer').querySelector('input[data-f=name]');i.focus();i.select()},60)};
$('csv').onclick=()=>{const h=['Grup','Hammadde','ERP kodu','Mevcut stok kg','4 haftalık tüketim kg','İlk gelecek giriş kg','İlk gelecek giriş haftası','Toplam giriş kg','Kaç hafta yeter','İlk eksik hafta','En düşük bakiye kg','Durum'];
  const L=[h.join(';')].concat((V.list||[]).map(r=>[r.m.grp,r.m.name,r.m.code,Math.round(r.now),Math.round(r.f4),r.g1?Math.round(r.g1):'',r.g1W?wl(r.g1W):'',Math.round(r.fin),r.cover==null?H+'+':r.cover,wl(r.firstNeg),Math.round(r.min),r.status].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')));
  dl(new Blob(['\ufeff'+L.join('\n')],{type:'text/csv'}),`hammadde_ozet_hafta${D.wk}_${D.yr}.csv`)};
function dl(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()}
$('bkp').onclick=()=>dl(new Blob([JSON.stringify(D)],{type:'application/json'}),`hammadde_yedek_hafta${D.wk}_${D.yr}.json`);
$('rst').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d.mats)throw new Error('Hammadde listesi yok');if(confirm('Paneldeki mevcut veriler yedektekiyle değiştirilsin mi?')){D=d;saveData();syncHead();closeM();render()}}
    catch(err){alert('Yedek dosyası okunamadı: '+err.message)}};rd.readAsText(f);e.target.value=''};

D=loadData();syncHead();render();
